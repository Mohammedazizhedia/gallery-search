name: Unpack zip
on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack
        run: |
          Z=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- '*.zip' | tail -n 1)
          if [ -z "$Z" ]; then
            Z=$(for f in *.zip; do n=$(echo "$f" | grep -o '[0-9]*' | tail -1); echo "${n:-0} $f"; done | sort -n | tail -n 1 | cut -d' ' -f2-)
          fi
          echo "Using $Z"
          mkdir /tmp/x
          unzip -q "$Z" -d /tmp/x
          SRC=/tmp/x
          if [ "$(ls -A /tmp/x | wc -l)" = "1" ] && [ -d "/tmp/x/$(ls /tmp/x)" ]; then
            SRC="/tmp/x/$(ls /tmp/x)"
          fi
          rsync -a --exclude .github "$SRC"/ .
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Unpack project" || echo "nothing to commit"
          git push
       
      - name: Trigger build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml
