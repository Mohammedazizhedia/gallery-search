name: Unpack zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack
        run: |
          Z=$(git -c core.quotepath=false log --name-only --diff-filter=AM --pretty=format: -- '*.zip' | grep -v '^$' | head -n 1)
          mkdir /tmp/x
          unzip -q "$Z" -d /tmp/x
          SRC=/tmp/x
          if [ "$(ls -A /tmp/x | wc -l)" = "1" ] && [ -d "/tmp/x/$(ls /tmp/x)" ]; then
            SRC="/tmp/x/$(ls /tmp/x)"
          fi
          rsync -a --exclude .github "$SRC"/ .
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Unpack project" || echo "nothing to commit"
          git push
